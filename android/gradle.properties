org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

# 工作区路径含中文（C:\Users\吴桥生\...）。AGP 在 Windows 上默认拒绝非 ASCII 项目路径，
# 这里显式放行；为降低 aapt2/D8 对非 ASCII 路径的敏感性，JDK/SDK/Gradle 全部安装在
# ASCII 路径 C:\tctoolchain 下（见 build-apk.ps1）。
# 若本机出现 aapt2 相关的路径报错，build-apk.ps1 -Mirror 会把源码镜像到 C:\tcandroid 再构建。
android.overridePathCheck=true

kotlin.code.style=official

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
